name: osteosense_app
description: Offline knee movement screening app with camera pose analysis, questionnaire, wearable sensors and PDF reports.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.12.1
  permission_handler: ^11.3.0
  google_mlkit_pose_detection: ^0.13.0
  sqflite: ^2.3.3
  path: ^1.9.0
  pdf: ^3.11.0
  printing: ^5.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
